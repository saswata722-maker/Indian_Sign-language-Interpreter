services:
  - type: web
    name: isl-sense
    env: python
    pythonVersion: "3.12"
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "."
      - key: USE_CUDA
        value: "false"
      - key: MODEL_PATH
        value: "models/best_model.pth"
      - key: CONFIDENCE_THRESHOLD
        value: "0.35"
      - key: SMOOTHING_WINDOW
        value: "5"
      - key: GATE_ENABLED
        value: "true"
      - key: GATE_MIN_POSE_COVERAGE
        value: "0.6"
      - key: GATE_MIN_HAND_COVERAGE
        value: "0.4"
      - key: GATE_MIN_MOTION
        value: "0.003"
