# ISL-Sense Training Configuration
# Based on AI4Bharat INCLUDE & OpenHands best practices

# Paths
raw_data_dir: "raw_data"
landmarks_dir: "landmarks"
model_save_dir: "models"
logs_dir: "logs"

# Landmark extraction
extraction:
  include_face: false      # false = 234 dims (recommended), true = 1632 dims
  model_complexity: 1      # 0=light, 1=full, 2=heavy
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

# Preprocessing
preprocessing:
  target_seq_len: 64       # frames per sequence (matches ~66 frame mean)
  temporal_jitter: 0.15    # ±15% speed augmentation
  spatial_noise: 0.01      # Gaussian noise std
  use_velocity: true       # append frame-to-frame deltas (doubles input_dim)

# Model architecture
model:
  input_dim: 456           # 228 landmarks + 228 velocity deltas
  d_model: 128             # transformer embedding dimension
  nhead: 4                 # attention heads
  num_transformer_layers: 2
  lstm_hidden: 64          # d_model // 2 for bidirectional
  dropout: 0.2

# Training
training:
  num_epochs: 80
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.1
  val_split: 0.2
  random_seed: 42
  use_class_weights: true  # weight loss inversely to class frequency
  early_stopping_patience: 15
  early_stopping_min_delta: 0.001
  max_grad_norm: 1.0
  use_amp: true

# Inference
inference:
  seq_len: 40              # sliding window length
  confidence_threshold: 0.75
  smoothing_window: 5      # majority vote over last N predictions
